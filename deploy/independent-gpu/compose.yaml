name: cdm-rag-independent
services:
  database:
    image: postgres:17.5-alpine
    restart: unless-stopped
    network_mode: host
    command: [postgres, -c, 'listen_addresses=127.0.0.1', -c, 'port=19090']
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${CDM_RAG_DB_PASSWORD:?Set CDM_RAG_DB_PASSWORD}
    volumes:
      - identity-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p 19090 -U keycloak -d keycloak']
      interval: 5s
      timeout: 3s
      retries: 30

  identity:
    image: quay.io/keycloak/keycloak:26.2.5
    command: [start, --import-realm]
    restart: unless-stopped
    network_mode: host
    depends_on:
      database: {condition: service_healthy}
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: 127.0.0.1
      KC_DB_URL_PORT: "19090"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${CDM_RAG_DB_PASSWORD:?Set CDM_RAG_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${CDM_RAG_ADMIN_USERNAME:?Set CDM_RAG_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CDM_RAG_ADMIN_PASSWORD:?Set CDM_RAG_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_HOST: 127.0.0.1
      KC_HTTP_PORT: '19091'
      KC_HTTP_MANAGEMENT_HOST: 127.0.0.1
      KC_HTTP_MANAGEMENT_PORT: '19095'
      KC_CACHE: local
      KC_HTTP_RELATIVE_PATH: /identity
      KC_HOSTNAME: https://${CDM_RAG_PUBLIC_HOST:?Set CDM_RAG_PUBLIC_HOST}/identity
      KC_PROXY_HEADERS: xforwarded
      CDM_RAG_PUBLIC_HOST: ${CDM_RAG_PUBLIC_HOST:?Set CDM_RAG_PUBLIC_HOST}
      CDM_RAG_OIDC_CLIENT_SECRET: ${CDM_RAG_OIDC_CLIENT_SECRET:?Set CDM_RAG_OIDC_CLIENT_SECRET}
      CDM_RAG_OWNER_USERNAME: ${CDM_RAG_OWNER_USERNAME:?Set CDM_RAG_OWNER_USERNAME}
      CDM_RAG_OWNER_EMAIL: ${CDM_RAG_OWNER_EMAIL:?Set CDM_RAG_OWNER_EMAIL}
      CDM_RAG_OWNER_FIRST_NAME: ${CDM_RAG_OWNER_FIRST_NAME:?Set CDM_RAG_OWNER_FIRST_NAME}
      CDM_RAG_OWNER_LAST_NAME: ${CDM_RAG_OWNER_LAST_NAME:?Set CDM_RAG_OWNER_LAST_NAME}
      CDM_RAG_OWNER_PASSWORD: ${CDM_RAG_OWNER_PASSWORD:?Set CDM_RAG_OWNER_PASSWORD}
    volumes:
      - ./keycloak/cdm-rag-realm.json:/opt/keycloak/data/import/cdm-rag-realm.json:ro

  login:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.9.0
    restart: unless-stopped
    network_mode: host
    depends_on: [identity, app]
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_HTTP_ADDRESS: 127.0.0.1:19092
      OAUTH2_PROXY_CLIENT_ID: cdm-rag
      OAUTH2_PROXY_CLIENT_SECRET: ${CDM_RAG_OIDC_CLIENT_SECRET:?Set CDM_RAG_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${CDM_RAG_COOKIE_SECRET:?Set CDM_RAG_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: 'true'
      OAUTH2_PROXY_COOKIE_HTTPONLY: 'true'
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: 'true'
      OAUTH2_PROXY_REVERSE_PROXY: 'true'
      OAUTH2_PROXY_SET_XAUTHREQUEST: 'true'
      OAUTH2_PROXY_EMAIL_DOMAINS: '*'
      OAUTH2_PROXY_UPSTREAMS: http://127.0.0.1:19093/
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://${CDM_RAG_PUBLIC_HOST:?Set CDM_RAG_PUBLIC_HOST}/identity/realms/cdm-rag
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: 'true'
      OAUTH2_PROXY_LOGIN_URL: https://${CDM_RAG_PUBLIC_HOST:?Set CDM_RAG_PUBLIC_HOST}/identity/realms/cdm-rag/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://127.0.0.1:19091/identity/realms/cdm-rag/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://127.0.0.1:19091/identity/realms/cdm-rag/protocol/openid-connect/certs
      OAUTH2_PROXY_REDIRECT_URL: https://${CDM_RAG_PUBLIC_HOST:?Set CDM_RAG_PUBLIC_HOST}/oauth2/callback
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: 'true'
      OAUTH2_PROXY_REQUEST_LOGGING: 'false'

  edge:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    network_mode: host
    depends_on: [identity, login]
    environment:
      CDM_RAG_PUBLIC_HOST: ${CDM_RAG_PUBLIC_HOST:?Set CDM_RAG_PUBLIC_HOST}
      CDM_RAG_EDGE_PORT: ${CDM_RAG_EDGE_PORT:-19089}
      CDM_RAG_TRUSTED_PROXY_SECRET: ${CDM_RAG_TRUSTED_PROXY_SECRET:?Set CDM_RAG_TRUSTED_PROXY_SECRET}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  app:
    image: ${CDM_RAG_IMAGE:?Set CDM_RAG_IMAGE to the immutable image digest}
    restart: unless-stopped
    network_mode: host
    environment:
      CDM_RAG_DATA_DIR: /data
      CDM_RAG_API_AUTH_REQUIRED: "true"
      CDM_RAG_OWNER_EMAIL: ${CDM_RAG_OWNER_EMAIL:?Set CDM_RAG_OWNER_EMAIL}
      CDM_RAG_OWNER_SUBJECT: ${CDM_RAG_OWNER_SUBJECT:?Set CDM_RAG_OWNER_SUBJECT to the owner's immutable OIDC subject}
      CDM_RAG_DEMO_EXPIRES_AT: ${CDM_RAG_DEMO_EXPIRES_AT:-}
      CDM_RAG_PUBLIC_HOST: ${CDM_RAG_PUBLIC_HOST:?Set CDM_RAG_PUBLIC_HOST}
      CDM_RAG_TRUSTED_PROXY_SECRET: ${CDM_RAG_TRUSTED_PROXY_SECRET:?Set CDM_RAG_TRUSTED_PROXY_SECRET}
      CDM_RAG_INITIAL_API_TOKEN: ${CDM_RAG_INITIAL_API_TOKEN:?Set CDM_RAG_INITIAL_API_TOKEN}
      OLLAMA_BASE_URL: http://127.0.0.1:19094
      CDM_RAG_MANAGE_MODEL_RESIDENCY: 'true'
      EMBEDDING_MODEL: qwen3-embedding:0.6b
      ROUTER_MODEL: qwen3:4b
      CDM_RAG_DECISION_MODEL: qwen3.5:9b
      ANSWER_MODEL: qwen3.5:9b
      SCOPE_MODEL: qwen3:4b
      JUDGE_MODEL: qwen2.5:0.5b
      CDM_RAG_ROUTER_BACKEND: ollama-evidence
      CDM_RAG_JUDGE_ENABLED: 'false'
      CDM_RAG_RERANK_ENABLED: 'true'
    command: [uvicorn, 'app.main:app', --host, 127.0.0.1, --port, '19093', --no-access-log]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:19093/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 180s
      retries: 3
    volumes:
      - app-data:/data

  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    network_mode: host
    devices:
      - 'nvidia.com/gpu=all'
    environment:
      OLLAMA_HOST: 127.0.0.1:19094
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - ollama-models:/root/.ollama
volumes:
  identity-db: {}
  app-data: {}
  ollama-models: {}
