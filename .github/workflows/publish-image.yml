name: Publish CDM RAG demo image

on:
  workflow_run:
    workflows: [Validate CDM RAG]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: cdm-rag-demo-image-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: image
        name: Build and smoke-test the validated revision
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cdm-rag-demo"
          image="$repository:sha-$SOURCE_SHA"
          docker build --platform linux/amd64 --tag "$image" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" .
          docker run --rm --entrypoint python "$image" -c 'import app.main, app.mcp_stdio'
          printf 'repository=%s\nimage=%s\n' "$repository" "$image" >> "$GITHUB_OUTPUT"
      - name: Publish the image and record its digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE" | tee "$RUNNER_TEMP/cdm-rag-demo-push.log"
          digest=$(sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p' "$RUNNER_TEMP/cdm-rag-demo-push.log")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Image tag: `%s`\n\nDeployment reference: `%s@%s`\n' \
            "$IMAGE" "$IMAGE_REPOSITORY" "$digest" >> "$GITHUB_STEP_SUMMARY"
